name: Tests CI on push

on:
  push:
    branches: [ "main" ]
    paths:
      - '3_1_LLM_agent/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '3_1_LLM_agent/**'

jobs:
  test:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependecies
        working-directory: 3_1_LLM_agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start libretranslate server
        run: |
          libretranslate --load-only en,ru &
          echo "Waiting for LibreTranslate to boot up..."
          for i in {1..20}; do
            if curl -s http://127.0.0 > /dev/null; then
              echo "LibreTranslate is ready!"
              break
            fi
            sleep 2
          done

      - name: Run unit-tests with coverage
        working-directory: 3_1_LLM_agent
        run: |
          coverage run -m pytest tests/test_translator.py -v
          coverage report -m

      - name: Generate coverage badge
        working-directory: 3_1_LLM_agent
        run: coverage-badge -o coverage.svg -f

      - name: Commit updated coverage badge
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coverage badge [skip ci]"
          file_pattern: 3_1_LLM_agent/coverage.svg